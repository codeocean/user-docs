          description: A capsule.
          headers:
            Request-ID:
              $ref: '#/components/headers/RequestID'
            API-Version:
              $ref: '#/components/headers/APIVersion'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request
          headers:
            Request-ID:
              $ref: '#/components/headers/RequestID'
            API-Version:
